<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Преобразование ссылок</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: #fff;
      color: #333;
      font-family: Arial, sans-serif;
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 0;
    }

    .container {
      width: 300px;
      max-width: calc(100% - 40px);
      margin: 0 auto;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      height: 42px;
      padding: 0 15px;
      border: 1px solid #d5d5d5;
      border-radius: 7px;
      background: #fff;
      color: #333;
      font-family: Arial, sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #999;
    }

    .output-label {
      margin-top: 20px;
    }

    .output {
      width: 100%;
      min-height: 42px;
      padding: 11px 15px;
      border: 1px dashed #c7c7c7;
      border-radius: 7px;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 18px;
      background: #fafafa;
    }

    .copy-button {
      display: block;
      width: 100%;
      height: 42px;
      margin-top: 12px;
      border: 1px solid #b0b0b0;
      border-radius: 7px;

      background: linear-gradient(
        135deg,
        #d4d4d4 0%,
        #bcbcbc 35%,
        #999999 70%,
        #858585 100%
      );

      color: #303030;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.07);
      -webkit-tap-highlight-color: transparent;
    }

    .copy-button:disabled {
      background: linear-gradient(
        135deg,
        #fafafa 0%,
        #f1f1f1 50%,
        #eaeaea 100%
      );
      border-color: #e5e5e5;
      color: #aaa;
      cursor: default;
      box-shadow: none;
    }

    .copy-button:hover:not(:disabled) {
      background: linear-gradient(
        135deg,
        #d0d0d0 0%,
        #b5b5b5 40%,
        #969696 100%
      );
    }

    .copy-button:active {
      transform: scale(0.98);
      outline: none;
    }

    .copy-button:focus,
    .copy-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px #dedede;
    }

    @media (max-height: 300px) {
      body {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <label for="original">
      Вставьте оригинальную ссылку сюда:
    </label>

    <input
      id="original"
      type="text"
      placeholder="t.me/username"
      autocomplete="off"
    >

    <label class="output-label">
      Здесь появится преобразованная ссылка:
    </label>

    <div class="output" id="result"></div>

    <button class="copy-button" id="copyButton" disabled>
      Скопировать ссылку
    </button>

  </main>

  <script>
    const original = document.getElementById("original");
    const result = document.getElementById("result");
    const copyButton = document.getElementById("copyButton");

    original.addEventListener("input", function () {
      let value = original.value.trim();

      // Убираем адрес Telegram.
      value = value.replace(
        /^(?:https?:\/\/)?(?:www\.)?t\.me\//i,
        ""
      );

      // Убираем @ перед именем.
      value = value.replace(/^@/, "");

      result.textContent = value ? "@" + value : "";

      copyButton.disabled = !value;
      copyButton.textContent = "Скопировать ссылку";

      copyButton.style.background = "";
      copyButton.style.borderColor = "";
    });

    copyButton.addEventListener("click", async function () {
      const text = result.textContent;

      if (!text) return;

      let copied = false;

      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (error) {
        const textarea = document.createElement("textarea");

        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();

        try {
          copied = document.execCommand("copy");
        } catch (e) {
          copied = false;
        }

        textarea.remove();
      }

      if (copied) {
        copyButton.textContent = "Скопировано!";

        copyButton.style.background =
          "linear-gradient(135deg, #e5eee7 0%, #d1dfd4 50%, #c2d3c6 100%)";

        copyButton.style.borderColor = "#c2d3c6";
      } else {
        copyButton.textContent = "Не удалось скопировать";
      }

      setTimeout(function () {
        copyButton.textContent = "Скопировать ссылку";
        copyButton.style.background = "";
        copyButton.style.borderColor = "";
      }, 2000);
    });
  </script>

</body>
</html>
